[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlib"
authors = [
    { name = "Associates of the AGENT project"}
]
maintainers = [
    { name = "Institute for Energy Efficient Buildings and Indoor Climate, RWTH Aachen University", email = "ebc-tools@eonerc.rwth-aachen.de" }
]
description = "Framework for development and execution of agents for control and simulation of energy systems."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "agents", "modular",
    "control", "distributed", "digital twin"
]
license = { text = "BSD-3-Clause" }
classifiers = [
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
# Lower bounds: first releases with CPython 3.11 wheels, raised further where older releases
# have known security advisories (pydantic, scipy, orjson, dash).
dependencies = [
    'numpy>=1.23.2',
    'pandas>=1.5.0',
    'simpy>=4.0.1',
    'pydantic>=2.4.0',
    'attrs>=22.2.0',
]
dynamic = ["version"]

[project.optional-dependencies]

fmu = ['FMPy>=0.3.6']
scipy = ['scipy>=1.10.0']
plot = ['matplotlib>=3.6.0']
orjson = ['orjson>=3.11.6']
fuzz = ['rapidfuzz>=2.5.0']
mqtt = ['paho-mqtt>=2.0.0']
interactive = ['dash>=2.15.0', 'dash-cytoscape', 'dash-bootstrap-components', 'plotly']
deploy = ['agentlib[fmu,scipy,orjson,fuzz,mqtt]']  # for docker etc
full = ['agentlib[fmu,scipy,plot,orjson,fuzz,mqtt,interactive]']

[package.urls]
homepage = "https://github.com/RWTH-EBC/AgentLib"
documentation = "https://github.com/RWTH-EBC/AgentLib"
